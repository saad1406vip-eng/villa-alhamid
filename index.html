<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فيلا الحميد">
<title>فيلا الحميد - نظام إدارة المشاريع المتكامل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--sand:#c8a96e;--sand2:#e8d5b0;--sand3:#9a7a45;--bg:#0f0e0c;--bg2:#181612;--bg3:#22201a;--bg4:#2c2920;--text:#f0e8d8;--text2:#b8a888;--text3:#6a6050;--green:#5a9e6f;--gbg:#182218;--red:#c06060;--rbg:#221818;--yellow:#c8a030;--ybg:#221e10;--blue:#5080a0;--bbg:#101820;--purple:#8b5cf6;--pbg:#2d1b4d;--orange:#f97316;--obg:#3b2a1a;--border:#353025;--r:14px;--tab:60px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;max-width:430px;margin:0 auto}
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-title{font-size:17px;font-weight:900;color:var(--sand)}
.hdr-sub{font-size:10px;color:var(--text3);margin-top:1px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.tabs{display:flex;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;height:var(--tab);overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:var(--text3);font-family:'Cairo',sans-serif;font-size:9px;font-weight:700;cursor:pointer;padding:6px 12px;position:relative;transition:color .2s;white-space:nowrap}
.tb.on{color:var(--sand)}
.tb.on::after{content:'';position:absolute;top:0;left:15%;right:15%;height:2px;background:var(--sand);border-radius:0 0 3px 3px}
.tb-ico{font-size:18px;line-height:1}
.pg{display:none;padding:14px}
.pg.on{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.ch{padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border)}
.ch.nb{border-bottom:none;cursor:default}
.ci{font-size:18px;flex-shrink:0}
.ct{font-size:13px;font-weight:700;flex:1}
.cv{color:var(--text3);transition:transform .25s;font-size:11px;flex-shrink:0}
.card.col .cv{transform:rotate(180deg)}
.cb{padding:12px 14px}
.card.col .cb{display:none}
.ir{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border);gap:8px}
.ir:last-child{border-bottom:none}
.il{font-size:11px;color:var(--text3);flex-shrink:0;padding-left:8px}
.iv{font-size:11px;color:var(--text);text-align:left;font-weight:600}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center}
.sv{font-size:15px;font-weight:900;color:var(--sand);line-height:1.2}
.sl{font-size:10px;color:var(--text3);margin-top:3px}
.tot{background:linear-gradient(135deg,var(--sand3),var(--sand));border-radius:var(--r);padding:14px 16px;text-align:center;margin-bottom:12px}
.tot .tl{font-size:10px;color:rgba(0,0,0,.6);font-weight:600}
.tot .ta{font-size:22px;font-weight:900;color:var(--bg);line-height:1.1}
.tag{display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:2px 7px;font-size:10px;font-weight:700;white-space:nowrap}
.tg{background:var(--gbg);color:var(--green)}
.tr{background:var(--rbg);color:var(--red)}
.ty{background:var(--ybg);color:var(--yellow)}
.tp{background:var(--pbg);color:var(--purple)}
.er{display:flex;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);gap:8px;cursor:pointer}
.er-info{flex:1;min-width:0}
.er-name{font-size:12px;color:var(--text);font-weight:600}
.er-right{text-align:left;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.er-amt{font-size:13px;font-weight:700;color:var(--sand)}
.sl2{font-size:10px;font-weight:700;color:var(--sand3);padding:10px 0 5px}
.empty{text-align:center;padding:20px 10px;color:var(--text3);font-size:12px}
.add-task-btn, .add-item-btn{background:var(--sand);color:var(--bg);border:none;border-radius:10px;padding:10px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px;width:100%}
.add-item-btn{background:var(--blue);color:white}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.overlay.h{display:none}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;padding:20px}
.sh-title{font-size:15px;font-weight:700;margin-bottom:14px}
.inp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--text);margin-bottom:10px}
.ma{display:flex;gap:10px;margin-top:6px}
.btn-p{flex:1;background:var(--sand);color:var(--bg);border:none;border-radius:10px;padding:12px;font-weight:700}
.btn-s{background:var(--bg4);color:var(--text2);border:1px solid var(--border);border-radius:10px;padding:12px}
.type-sel{display:flex;gap:6px;margin-bottom:10px}
.type-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);font-size:10px;text-align:center;cursor:pointer}
.type-btn.on{background:var(--sand3);color:white}
.share-btn{background:var(--gbg);border:1px solid var(--green);color:var(--green);padding:10px;border-radius:10px;width:100%;font-weight:700;margin-bottom:8px}
.print-btn{background:var(--bbg);border:1px solid var(--blue);color:var(--blue);padding:10px;border-radius:10px;width:100%;font-weight:700}
@media print{
  body{max-width:100%;background:#fff;color:#000}
  .tabs,.overlay,.hdr,.add-task-btn,.add-item-btn,.share-btn,.print-btn{display:none!important}
  .card{border:1px solid #ddd;break-inside:avoid}
}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title">🏡 فيلا الحميد</div>
    <div class="hdr-sub">نظام إدارة مالي متكامل</div>
  </div>
</div>

<div class="scroll" id="mainScroll">
  <div class="pg on" id="pg-home"><div id="homeSummary"></div>
    <div class="card"><div class="ch" onclick="tog(this)"><span class="ci">📐</span><span class="ct">بيانات المشروع</span><span class="cv">▲</span></div><div class="cb" id="projectData"></div></div>
    <div class="card"><div class="ch" onclick="tog(this)"><span class="ci">📅</span><span class="ct">التواريخ الرئيسية</span><span class="cv">▲</span></div><div class="cb" id="datesData"></div></div>
  </div>

  <div class="pg" id="pg-tasks">
    <div class="card"><div class="ch" onclick="tog(this)"><span class="ci">✅</span><span class="ct">المهام والملاحظات</span><span class="cv">▲</span></div><div class="cb"><div id="checkWrap"></div><button class="add-task-btn" onclick="openAddTask()">＋ إضافة مهمة جديدة</button><button class="add-item-btn" onclick="openAddFinancialItem()">💰 ＋ إضافة بند مالي</button></div></div>
  </div>

  <div class="pg" id="pg-electric"><div id="electricSum"></div><div class="card"><div class="cb" id="electricMaterials"></div></div><div class="card"><div class="cb" id="electricLabor"></div></div></div>
  <div class="pg" id="pg-plumbing"><div id="plumbingSum"></div><div class="card"><div class="cb" id="plumbingMaterials"></div></div><div class="card"><div class="cb" id="plumbingLabor"></div></div></div>
  <div class="pg" id="pg-tiles"><div id="tilesSum"></div><div class="card"><div class="cb" id="tilesMaterials"></div></div><div class="card"><div class="cb" id="tilesLabor"></div></div></div>
  <div class="pg" id="pg-decor"><div id="decorSum"></div><div class="card"><div class="cb" id="decorMaterials"></div></div><div class="card"><div class="cb" id="decorLabor"></div></div></div>
  <div class="pg" id="pg-other"><div id="otherSum"></div><div class="card"><div class="cb" id="otherMaterials"></div></div><div class="card"><div class="cb" id="otherLabor"></div></div></div>
  
  <div class="pg" id="pg-report">
    <div id="reportContent"></div>
    <div class="card">
        <div class="cb">
            <button class="share-btn" onclick="shareWA()">📲 مشاركة عبر واتساب</button>
            <button class="print-btn" onclick="window.print()">🖨️ طباعة التقرير</button>
            <div class="ma" style="margin-top:10px">
                <button class="btn-s" style="flex:1" onclick="exportData()">📤 تصدير</button>
                <button class="btn-s" style="flex:1" onclick="importData()">📥 استيراد</button>
            </div>
        </div>
    </div>
  </div>
</div>

<nav class="tabs">
  <button class="tb on" onclick="sw('home',this)">🏡 الرئيسية</button>
  <button class="tb" onclick="sw('tasks',this)">✅ مهام</button>
  <button class="tb" onclick="sw('electric',this)">⚡ كهرباء</button>
  <button class="tb" onclick="sw('plumbing',this)">🚿 سباكة</button>
  <button class="tb" onclick="sw('tiles',this)">🟦 تبليط</button>
  <button class="tb" onclick="sw('decor',this)">🎨 ديكور</button>
  <button class="tb" onclick="sw('other',this)">🔧 متفرقات</button>
  <button class="tb" onclick="sw('report',this)">📊 تقرير</button>
</nav>

<div class="overlay h" id="addTaskModal"><div class="sheet"><div class="sh-title">إضافة مهمة</div><input class="inp" id="newTaskText" placeholder="نص المهمة"><div class="ma"><button class="btn-p" onclick="saveNewTask()">حفظ</button><button class="btn-s" onclick="closeModal()">إلغاء</button></div></div></div>

<div class="overlay h" id="addItemModal">
  <div class="sheet">
    <div class="sh-title">💰 إضافة بند مالي</div>
    <div class="type-sel"><div class="type-btn on" id="t-mat" onclick="setItemType('material')">📦 مواد</div><div class="type-btn" id="t-lab" onclick="setItemType('labor')">👷 أجور</div></div>
    <input class="inp" id="newItemDesc" placeholder="الوصف">
    <input class="inp" id="newItemAmount" type="number" placeholder="المبلغ الكلي">
    <select class="inp" id="newItemCat"><option value="electric">كهرباء</option><option value="plumbing">سباكة</option><option value="tiles">تبليط</option><option value="decor">ديكور</option><option value="other">متفرقات</option></select>
    <select class="inp" id="newItemStatus" onchange="togglePaidInput(this.value, 'newItemPaid')"><option value="paid">مدفوع بالكامل</option><option value="partial">مدفوع جزئياً</option><option value="pending">غير مدفوع</option><option value="planned">مخطط</option></select>
    <input class="inp h" id="newItemPaid" type="number" placeholder="المبلغ المدفوع فعلياً">
    <div class="ma"><button class="btn-p" onclick="saveNewItem()">إضافة</button><button class="btn-s" onclick="closeModal()">إلغاء</button></div>
  </div>
</div>

<div class="overlay h" id="importModal"><div class="sheet"><div class="sh-title">استيراد بيانات</div><input type="file" id="importFile" class="inp" accept=".json"><div class="ma"><button class="btn-p" onclick="processImport()">تحميل</button><button class="btn-s" onclick="closeModal()">إلغاء</button></div></div></div>

<script>
let ALL_DATA = JSON.parse(localStorage.getItem('villa_v10')) || {
  projectInfo: {"المساحة": "560 م²", "الموقع": "العزيزية"},
  dates: {"البداية": "24/4/1440 هـ"},
  materials: {electric:[], plumbing:[], tiles:[], decor:[], other:[]},
  labor: {electric:[], plumbing:[], tiles:[], decor:[], other:[]},
  tasks: []
};

const CATEGORIES = ['electric', 'plumbing', 'tiles', 'decor', 'other'];
const FIXED_COSTS = { land:200000, skeleton:273000, phase1:98000 };
let currentItemType = 'material';

function save() { localStorage.setItem('villa_v10', JSON.stringify(ALL_DATA)); renderAll(); }

function sw(name, btn) {
  document.querySelectorAll('.pg').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tb').forEach(b => b.classList.remove('on'));
  document.getElementById('pg-'+name).classList.add('on');
  btn.classList.add('on');
}

function setItemType(t) {
    currentItemType = t;
    document.getElementById('t-mat').classList.toggle('on', t==='material');
    document.getElementById('t-lab').classList.toggle('on', t==='labor');
}

function togglePaidInput(val, id) { document.getElementById(id).classList.toggle('h', val !== 'partial'); }

function closeModal() { document.querySelectorAll('.overlay').forEach(o => o.classList.add('h')); }

function openAddTask() { document.getElementById('addTaskModal').classList.remove('h'); }
function saveNewTask() {
    const txt = document.getElementById('newTaskText').value;
    if(!txt) return;
    ALL_DATA.tasks.push({id:Date.now(), text:txt, completed:false});
    save(); closeModal();
}

function openAddFinancialItem() { document.getElementById('addItemModal').classList.remove('h'); }
function saveNewItem() {
    const desc = document.getElementById('newItemDesc').value;
    const amt = parseFloat(document.getElementById('newItemAmount').value) || 0;
    const cat = document.getElementById('newItemCat').value;
    const stat = document.getElementById('newItemStatus').value;
    const paid = stat === 'paid' ? amt : (stat === 'partial' ? parseFloat(document.getElementById('newItemPaid').value)||0 : 0);
    
    if(!desc || amt <=0) return;
    ALL_DATA[currentItemType][cat].push({id:Date.now(), name:desc, amount:amt, status:stat, paidAmt:paid});
    save(); closeModal();
}

function renderAll() {
    // 1. التواريخ والبيانات
    document.getElementById('projectData').innerHTML = Object.entries(ALL_DATA.projectInfo).map(([k,v]) => `<div class="ir"><span class="il">${k}</span><span class="iv">${v}</span></div>`).join('');
    document.getElementById('datesData').innerHTML = Object.entries(ALL_DATA.dates).map(([k,v]) => `<div class="ir"><span class="il">${k}</span><span class="iv">${v}</span></div>`).join('');

    // 2. المهام
    document.getElementById('checkWrap').innerHTML = ALL_DATA.tasks.map(t => `<div class="er" onclick="toggleT('${t.id}')"><span>${t.completed?'✅':'⬜'}</span> <span style="${t.completed?'text-decoration:line-through':''}">${t.text}</span></div>`).join('');

    // 3. الأقسام الملحقة
    CATEGORIES.forEach(cat => {
        const m = ALL_DATA.materials[cat] || [];
        const l = ALL_DATA.labor[cat] || [];
        document.getElementById(cat+'Materials').innerHTML = `<div class="sl2">📦 المواد</div>` + m.map(i => itemHtml(i)).join('') || '<div class="empty">لا يوجد</div>';
        document.getElementById(cat+'Labor').innerHTML = `<div class="sl2">👷 أجور اليد</div>` + l.map(i => itemHtml(i)).join('') || '<div class="empty">لا يوجد</div>';
        
        const mSum = m.reduce((a,b)=>a+b.amount,0);
        const lSum = l.reduce((a,b)=>a+b.amount,0);
        document.getElementById(cat+'Sum').innerHTML = `<div class="sg"><div class="sc"><div class="sv">${mSum.toLocaleString()}</div><div class="sl">مواد</div></div><div class="sc"><div class="sv">${lSum.toLocaleString()}</div><div class="sl">أجور</div></div></div>`;
    });

    renderReport();
}

function itemHtml(i) {
    const badge = i.status === 'paid' ? 'tg' : (i.status === 'partial' ? 'ty' : 'tr');
    const label = i.status === 'paid' ? 'مدفوع' : (i.status === 'partial' ? 'جزئي' : 'غير مدفوع');
    return `<div class="er"><div class="er-info"><div class="er-name">${i.name}</div></div><div class="er-right"><div class="er-amt">${i.amount.toLocaleString()} ر</div><span class="tag ${badge}">${label}</span></div></div>`;
}

function toggleT(id) {
    const t = ALL_DATA.tasks.find(x => x.id == id);
    if(t) t.completed = !t.completed;
    save();
}

function renderReport() {
    let mPaid = 0, mUnpaid = 0, lPaid = 0, lUnpaid = 0;

    CATEGORIES.forEach(cat => {
        ALL_DATA.materials[cat].forEach(i => {
            mPaid += i.paidAmt || 0;
            if(i.status !== 'planned') mUnpaid += (i.amount - (i.paidAmt || 0));
        });
        ALL_DATA.labor[cat].forEach(i => {
            lPaid += i.paidAmt || 0;
            if(i.status !== 'planned') lUnpaid += (i.amount - (i.paidAmt || 0));
        });
    });

    const totalPaid = mPaid + lPaid + FIXED_COSTS.land + FIXED_COSTS.skeleton + FIXED_COSTS.phase1;
    const totalRem = mUnpaid + lUnpaid;

    document.getElementById('reportContent').innerHTML = `
        <div class="tot"><div class="tl">💰 إجمالي المصروفات المدفوعة</div><div class="ta">${totalPaid.toLocaleString()} ريال</div></div>
        <div class="sg">
            <div class="sc"><div class="sv">${mPaid.toLocaleString()}</div><div class="sl">مواد مدفوعة</div></div>
            <div class="sc"><div class="sv">${lPaid.toLocaleString()}</div><div class="sl">أجور مدفوعة</div></div>
            <div class="sc" style="background:var(--rbg)"><div class="sv" style="color:var(--red)">${totalRem.toLocaleString()}</div><div class="sl">مبالغ متبقية للعمال</div></div>
            <div class="sc"><div class="sv">${(totalPaid + totalRem).toLocaleString()}</div><div class="sl">تكلفة المشروع الكلية</div></div>
        </div>
    `;
}

function exportData() {
    const blob = new Blob([JSON.stringify(ALL_DATA)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'villa_backup.json';
    a.click();
}

function importData() { document.getElementById('importModal').classList.remove('h'); }
function processImport() {
    const file = document.getElementById('importFile').files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        ALL_DATA = JSON.parse(e.target.result);
        save(); closeModal();
    };
    reader.readAsText(file);
}

function shareWA() {
    const txt = `🏡 تقرير فيلا الحميد\nإجمالي المدفوع: ${document.querySelector('.ta').innerText}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`);
}

function tog(h) { h.closest('.card').classList.toggle('col'); }

renderAll();
</script>
</body>
</html>
