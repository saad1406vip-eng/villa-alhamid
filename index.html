<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فيلا الحميد - النظام الشامل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--sand:#c8a96e;--sand2:#e8d5b0;--sand3:#9a7a45;--bg:#0f0e0c;--bg2:#181612;--bg3:#22201a;--bg4:#2c2920;--text:#f0e8d8;--text2:#b8a888;--text3:#6a6050;--green:#5a9e6f;--gbg:#182218;--red:#c06060;--rbg:#221818;--yellow:#c8a030;--ybg:#221e10;--blue:#5080a0;--bbg:#101820;--purple:#8b5cf6;--pbg:#2d1b4d;--border:#353025;--r:14px;--tab:60px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text)}
body{max-width:430px;margin:0 auto;display:flex;flex-direction:column}
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:15px;flex-shrink:0}
.hdr-title{font-size:18px;font-weight:900;color:var(--sand)}
.scroll{flex:1;overflow-y:auto;padding:15px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.tabs{display:flex;background:var(--bg2);border-top:1px solid var(--border);height:var(--tab);flex-shrink:0}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:none;color:var(--text3);font-size:10px;font-family:inherit;cursor:pointer}
.tb.on{color:var(--sand);border-top:2px solid var(--sand)}
.pg{display:none}.pg.on{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.ch{padding:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.ct{font-size:14px;font-weight:700;flex:1}
.cb{padding:12px}
.ir{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
.il{font-size:12px;color:var(--text3)}
.iv{font-size:12px;font-weight:700}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{background:var(--bg3);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--border)}
.sv{font-size:16px;font-weight:900;color:var(--sand)}
.sl{font-size:10px;color:var(--text3)}
.tot{background:linear-gradient(135deg,var(--sand3),var(--sand));border-radius:var(--r);padding:20px;text-align:center;margin-bottom:15px;color:var(--bg)}
.ta{font-size:24px;font-weight:900}
.er{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.tag{font-size:9px;padding:2px 6px;border-radius:5px;font-weight:700}
.tg{background:var(--gbg);color:var(--green)}
.tr{background:var(--rbg);color:var(--red)}
.ty{background:var(--ybg);color:var(--yellow)}
.tp{background:var(--pbg);color:var(--purple)}
.btn-p{width:100%;background:var(--sand);color:var(--bg);border:none;padding:12px;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-add-inline{background:var(--bbg);color:var(--blue);border:1px dashed var(--blue);font-size:12px;margin-bottom:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;display:flex;align-items:flex-end;justify-content:center}
.h{display:none}.sheet{background:var(--bg2);width:100%;max-width:430px;padding:20px;border-radius:20px 20px 0 0;max-height:90%;overflow-y:auto}
.inp{width:100%;background:var(--bg3);border:1px solid var(--border);padding:10px;color:#fff;border-radius:8px;margin-bottom:10px;font-family:inherit}
.lbl-s{font-size:11px;color:var(--text3);margin-bottom:5px;display:block}
@media print{.tabs,.hdr,.btn-p,.overlay,.btn-add-inline{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #000}}
</style>
</head>
<body>

<div class="hdr">
    <div class="hdr-title">🏡 فيلا الحميد</div>
    <div style="font-size:10px;color:var(--text3)">نظام إدارة التشطيب (البيانات المدمجة)</div>
</div>

<div class="scroll" id="mainScroll">
    <div class="pg on" id="pg-home">
        <div class="tot"><div style="font-size:12px">إجمالي المدفوع فعلياً</div><div class="ta" id="grandTotal">0</div><div>ريال</div></div>
        <div class="card"><div class="ch"><span class="ct">📐 بيانات المشروع الأساسية</span></div><div class="cb" id="projectData"></div></div>
        <div class="card"><div class="ch"><span class="ct">📅 التواريخ والأحداث</span></div><div class="cb" id="datesData"></div></div>
    </div>

    <div class="pg" id="pg-electric"><div id="electricSum"></div><button class="btn-p btn-add-inline" onclick="prepareNewItem('electric')">➕ بند كهرباء جديد</button><div class="card"><div class="cb" id="electricList"></div></div></div>
    <div class="pg" id="pg-plumbing"><div id="plumbingSum"></div><button class="btn-p btn-add-inline" onclick="prepareNewItem('plumbing')">➕ بند سباكة جديد</button><div class="card"><div class="cb" id="plumbingList"></div></div></div>
    <div class="pg" id="pg-tiles"><div id="tilesSum"></div><button class="btn-p btn-add-inline" onclick="prepareNewItem('tiles')">➕ بند بلاط جديد</button><div class="card"><div class="cb" id="tilesList"></div></div></div>
    <div class="pg" id="pg-decor"><div id="decorSum"></div><button class="btn-p btn-add-inline" onclick="prepareNewItem('decor')">➕ بند ديكور جديد</button><div class="card"><div class="cb" id="decorList"></div></div></div>
    <div class="pg" id="pg-other"><div id="otherSum"></div><button class="btn-p btn-add-inline" onclick="prepareNewItem('other')">➕ بند متفرقات جديد</button><div class="card"><div class="cb" id="otherList"></div></div></div>

    <div class="pg" id="pg-report">
        <div id="reportDetail"></div>
        <button class="btn-p" style="background:var(--blue);color:#fff" onclick="window.print()">🖨️ طباعة التقرير</button>
        <button class="btn-p" style="background:var(--green);color:#fff" onclick="exportJSON()">📤 تصدير نسخة احتياطية</button>
    </div>
</div>

<nav class="tabs">
    <button class="tb on" onclick="sw('home',this)">🏡 الرئيسية</button>
    <button class="tb" onclick="sw('electric',this)">⚡ كهرباء</button>
    <button class="tb" onclick="sw('plumbing',this)">🚿 سباكة</button>
    <button class="tb" onclick="sw('tiles',this)">🟦 تبليط</button>
    <button class="tb" onclick="sw('decor',this)">🎨 ديكور</button>
    <button class="tb" onclick="sw('other',this)">🔧 متفرقات</button>
    <button class="tb" onclick="sw('report',this)">📊 تقرير</button>
</nav>

<div class="overlay h" id="editModal">
    <div class="sheet">
        <h3 id="editTitle" style="margin-bottom:15px; color:var(--sand)">تعديل البيانات</h3>
        <span class="lbl-s">نوع البند:</span>
        <select class="inp" id="editTypeTag">
            <option value="mat">📦 مواد (فقط)</option>
            <option value="lab">👷 أجرة يد (فقط)</option>
            <option value="combo">🤝 قاطوعة (مواد + أجرة)</option>
        </select>
        <span class="lbl-s">الوصف:</span>
        <input class="inp" id="editName">
        <span class="lbl-s">المبلغ الكلي (ريال):</span>
        <input class="inp" id="editAmt" type="number">
        <div id="paidSection">
            <span class="lbl-s">الحالة:</span>
            <select class="inp" id="editStat" onchange="checkStat(this.value)">
                <option value="paid">✅ مدفوع بالكامل</option>
                <option value="partial">⏳ مدفوع جزئياً</option>
                <option value="pending">🔴 غير مدفوع</option>
                <option value="planned">📋 مخطط مستقبلي</option>
            </select>
            <div id="partialInputWrap" class="h">
                <span class="lbl-s">المبلغ المدفوع حالياً:</span>
                <input class="inp" id="editPaidAmt" type="number">
            </div>
        </div>
        <div style="display:flex;gap:10px">
            <button class="btn-p" onclick="saveEdit()">💾 حفظ</button>
            <button class="btn-p" style="background:var(--bg4);color:var(--text)" onclick="closeM()">إلغاء</button>
        </div>
        <button id="deleteBtn" class="btn-p" style="background:none;color:var(--red);font-size:11px" onclick="deleteItem()">🗑️ حذف البند</button>
    </div>
</div>

<script>
// دمج كافة بياناتك القديمة (التي ذكرتها في الأكواد السابقة)
const ALL_OLD_DATA = {
    projectInfo: { "المساحة الكلية": "560 م²", "مساحة الأرض": "733 م²", "الدور الأرضي": "205 م²", "الدور الأول": "205 م²", "الديوانية": "41 م²", "مجموع الجدران": "2,770 م²" },
    dates: { "بدء بناء العظم": "24/4/1440 هـ", "سداد العظم": "28/10/2020م", "بداية التشطيب الأولى": "14/2/1442 هـ", "بداية التشطيب الثانية": "لم تحدد" },
    fixedCosts: { "شراء الأرض": 200000, "بناء العظم": 273000 },
    sections: {
        electric: [
            { name: "مواد كهرباء التأسيس", amt: 14728, paid: 14728, stat: "paid", type: "mat" },
            { name: "أجرة كهربائي التأسيس", amt: 7000, paid: 7000, stat: "paid", type: "lab" },
            { name: "باقي أجرة الكهربائي", amt: 6000, paid: 0, stat: "pending", type: "lab" }
        ],
        plumbing: [
            { name: "مواد سباكة التأسيس", amt: 15613, paid: 15613, stat: "paid", type: "mat" },
            { name: "أجرة سباك التأسيس", amt: 3500, paid: 3500, stat: "paid", type: "lab" },
            { name: "مواد خزان مياه", amt: 1500, paid: 1500, stat: "paid", type: "mat" },
            { name: "باقي أجرة السباك", amt: 4000, paid: 0, stat: "pending", type: "lab" }
        ],
        tiles: [
            { name: "مواد اللياسة", amt: 6500, paid: 6500, stat: "paid", type: "mat" },
            { name: "أجرة اللياسة", amt: 26000, paid: 26000, stat: "paid", type: "lab" },
            { name: "أجرة المبلط", amt: 26000, paid: 0, stat: "pending", type: "lab" }
        ],
        decor: [
            { name: "قرميد", amt: 12350, paid: 12350, stat: "paid", type: "combo" },
            { name: "ديكور جبس", amt: 15000, paid: 0, stat: "planned", type: "combo" },
            { name: "دهانات خارجية", amt: 25000, paid: 0, stat: "planned", type: "combo" },
            { name: "مشب", amt: 8000, paid: 0, stat: "planned", type: "combo" }
        ],
        other: [
            { name: "أعمال تجهيز وتسوية", amt: 12950, paid: 12950, stat: "paid", type: "combo" },
            { name: "حلوق أبواب حديد", amt: 5100, paid: 5100, stat: "paid", type: "mat" },
            { name: "تأسيس مكيفات", amt: 4000, paid: 4000, stat: "paid", type: "mat" },
            { name: "تصميم الديكور", amt: 9000, paid: 9000, stat: "paid", type: "lab" },
            { name: "تأسيس الغاز", amt: 920, paid: 920, stat: "paid", type: "mat" }
        ]
    }
};

let DB = JSON.parse(localStorage.getItem('villa_db_final_v1')) || ALL_OLD_DATA;
let activeEdit = null;

function saveDB() { localStorage.setItem('villa_db_final_v1', JSON.stringify(DB)); renderAll(); }

function sw(pgId, btn) {
    document.querySelectorAll('.pg').forEach(p => p.classList.remove('on'));
    document.querySelectorAll('.tb').forEach(b => b.classList.remove('on'));
    document.getElementById('pg-'+pgId).classList.add('on');
    btn.classList.add('on');
}

function renderAll() {
    document.getElementById('projectData').innerHTML = Object.entries(DB.projectInfo).map(([k,v]) => `<div class="ir" onclick="editInfo('info','${k}')"><span class="il">${k}</span><span class="iv">${v}</span></div>`).join('');
    document.getElementById('datesData').innerHTML = Object.entries(DB.dates).map(([k,v]) => `<div class="ir" onclick="editInfo('date','${k}')"><span class="il">${k}</span><span class="iv">${v}</span></div>`).join('');

    let totalPaid = DB.fixedCosts["شراء الأرض"] + DB.fixedCosts["بناء العظم"];
    
    Object.keys(DB.sections).forEach(sId => {
        const list = DB.sections[sId];
        document.getElementById(sId+'List').innerHTML = list.map((item, idx) => {
            const badge = item.stat==='paid'?'tg':(item.stat==='partial'?'ty':(item.stat==='pending'?'tr':'tp'));
            const typeLabel = item.type==='mat'?'📦 مواد':(item.type==='lab'?'👷 أجرة':'🤝 قاطوعة');
            return `<div class="er" onclick="openEditItem('${sId}', ${idx})">
                <div style="flex:1"><div style="font-size:13px;font-weight:700">${item.name}</div><div style="font-size:10px;color:var(--text3)">${typeLabel}</div></div>
                <div style="text-align:left"><div style="font-size:13px;font-weight:700;color:var(--sand)">${item.amt.toLocaleString()} ر</div><span class="tag ${badge}">${item.stat}</span></div>
            </div>`;
        }).join('') || '<div style="text-align:center;padding:10px;color:var(--text3);font-size:11px">لا يوجد بنود</div>';
        
        const sPaid = list.reduce((a,b) => a + (b.paid || 0), 0);
        const sRem = list.reduce((a,b) => a + (b.amt - b.paid), 0);
        totalPaid += sPaid;
        document.getElementById(sId+'Sum').innerHTML = `<div class="sg"><div class="sc"><div class="sv">${sPaid.toLocaleString()}</div><div class="sl">مدفوع</div></div><div class="sc"><div class="sv" style="color:var(--red)">${sRem.toLocaleString()}</div><div class="sl">متبقي</div></div></div>`;
    });

    document.getElementById('grandTotal').innerText = totalPaid.toLocaleString();
    renderReportDetail(totalPaid);
}

function renderReportDetail(totalPaid) {
    let mPaid = 0, lPaid = 0, cPaid = 0, mRem = 0, lRem = 0, cRem = 0, planned = 0;
    Object.values(DB.sections).forEach(sec => {
        sec.forEach(i => {
            if(i.stat === 'planned') planned += i.amt;
            else {
                if(i.type === 'mat') { mPaid += i.paid; mRem += (i.amt - i.paid); }
                else if(i.type === 'lab') { lPaid += i.paid; lRem += (i.amt - i.paid); }
                else { cPaid += i.paid; cRem += (i.amt - i.paid); }
            }
        });
    });

    document.getElementById('reportDetail').innerHTML = `
        <div class="tot" style="background:var(--bg3);border:1px solid var(--sand);color:var(--sand)">
            <div style="font-size:12px;color:var(--text2)">المنصرف الفعلي الإجمالي</div>
            <div class="ta">${totalPaid.toLocaleString()} ريال</div>
        </div>
        <div class="sg" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="sc"><div class="sv" style="font-size:12px">${mPaid.toLocaleString()}</div><div class="sl">مواد</div></div>
            <div class="sc"><div class="sv" style="font-size:12px">${lPaid.toLocaleString()}</div><div class="sl">أجور</div></div>
            <div class="sc"><div class="sv" style="font-size:12px">${cPaid.toLocaleString()}</div><div class="sl">قاطوعة</div></div>
        </div>
        <div class="card"><div class="cb">
            <div class="ir"><span class="il">ديون مستحقة حالياً</span><span class="iv" style="color:var(--red)">${(mRem+lRem+cRem).toLocaleString()} ريال</span></div>
            <div class="ir"><span class="il">مخططات مستقبلية</span><span class="iv" style="color:var(--purple)">${planned.toLocaleString()} ريال</span></div>
            <div class="ir"><span class="il">تقدير التكلفة الكلية</span><span class="iv" style="color:var(--sand)">${(totalPaid + mRem + lRem + cRem + planned).toLocaleString()} ريال</span></div>
        </div></div>`;
}

function prepareNewItem(sec) {
    activeEdit = { type: 'new', sec };
    document.getElementById('editTitle').innerText = "إضافة بند";
    document.getElementById('editName').value = "";
    document.getElementById('editAmt').value = "";
    document.getElementById('editStat').value = "paid";
    document.getElementById('editPaidAmt').value = "";
    document.getElementById('deleteBtn').classList.add('h');
    checkStat("paid");
    document.getElementById('editModal').classList.remove('h');
}

function openEditItem(sec, idx) {
    activeEdit = { type: 'edit', sec, idx };
    const item = DB.sections[sec][idx];
    document.getElementById('editName').value = item.name;
    document.getElementById('editAmt').value = item.amt;
    document.getElementById('editStat').value = item.stat;
    document.getElementById('editPaidAmt').value = item.paid;
    document.getElementById('editTypeTag').value = item.type || 'mat';
    document.getElementById('deleteBtn').classList.remove('h');
    checkStat(item.stat);
    document.getElementById('editModal').classList.remove('h');
}

function editInfo(type, key) {
    activeEdit = { type, key };
    document.getElementById('editName').value = (type === 'info' ? DB.projectInfo[key] : DB.dates[key]);
    document.getElementById('editAmt').parentElement.style.display = 'none'; // إخفاء حقول المال عند تعديل نصوص الرئيسية
    document.getElementById('editModal').classList.remove('h');
}

function checkStat(v) { document.getElementById('partialInputWrap').classList.toggle('h', v !== 'partial'); }

function saveEdit() {
    const name = document.getElementById('editName').value;
    if(activeEdit.type === 'info') DB.projectInfo[activeEdit.key] = name;
    else if(activeEdit.type === 'date') DB.dates[activeEdit.key] = name;
    else {
        const amt = parseFloat(document.getElementById('editAmt').value) || 0;
        const stat = document.getElementById('editStat').value;
        const type = document.getElementById('editTypeTag').value;
        let paid = (stat==='paid')?amt:(stat==='partial'?parseFloat(document.getElementById('editPaidAmt').value)||0:0);
        
        if(activeEdit.type === 'new') DB.sections[activeEdit.sec].push({name, amt, paid, stat, type});
        else DB.sections[activeEdit.sec][activeEdit.idx] = {name, amt, paid, stat, type};
    }
    saveDB(); closeM();
}

function deleteItem() { if(confirm("حذف؟")) { DB.sections[activeEdit.sec].splice(activeEdit.idx,1); saveDB(); closeM(); } }
function closeM() { document.getElementById('editModal').classList.add('h'); location.reload(); } // لضمان تصفير الحقول المخفية
function exportJSON() { alert(JSON.stringify(DB)); }

renderAll();
</script>
</body>
</html>
